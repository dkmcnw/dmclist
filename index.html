<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMC Pricelist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Login Page Styles */
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            display: none;
            animation: shake 0.5s;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .login-footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 13px;
        }

        .password-toggle {
            position: relative;
        }

        .toggle-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            user-select: none;
            font-size: 18px;
        }

        .toggle-icon:hover {
            color: #667eea;
        }

        /* Pricelist Page Styles */
        .pricelist-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .logout-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .search-box {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .item-count {
            padding: 12px 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 74px;
            z-index: 99;
        }

        .item-count strong {
            color: #667eea;
            font-weight: 700;
        }

        .price-list {
            padding: 10px;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }

        .price-item {
            padding: 18px;
            margin: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .price-item:hover {
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
            border-color: #667eea;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 15px;
        }

        .item-name {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
            flex: 1;
        }

        .item-codes {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .code-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }

        .code-badge span {
            font-family: monospace;
            color: #333;
            font-weight: 600;
        }

        .item-prices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e0e0e0;
        }

        .price-box {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .price-box.before-tax {
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
        }

        .price-box.after-tax {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea;
        }

        .price-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .price-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .price-box.before-tax .price-value {
            color: #666;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            display: none;
        }

        .no-results.show {
            display: block;
        }

        .no-results h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #666;
        }

        .no-results p {
            font-size: 14px;
        }

        .price-list::-webkit-scrollbar {
            width: 8px;
        }

        .price-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .price-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .price-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .pricelist-container {
                border-radius: 0;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .header h1 {
                font-size: 22px;
            }

            .item-prices {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .item-header {
                flex-direction: column;
                gap: 10px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-form {
                padding: 30px 20px;
            }
        }
    </style>
</head>

            </div>

                <div class="form-group">

                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-toggle">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            style="padding-left: 45px;"
                        >
                        <span class="toggle-icon" onclick="togglePassword()">👁️</span>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>
            </form>
        </div>

        <div class="login-footer">
            &copy; 2026 DMC Medical Center
        </div>
    </div>

        // Check if user is logged in on page load
        window.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showPricelist();
            } else {
                showLogin();
            }
        });

        // Show login page
        function showLogin() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('pricelistPage').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('username').focus();
            }, 100);
        }

        // Show pricelist page
        function showPricelist() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('pricelistPage').classList.remove('hidden');
            
            // Initialize pricelist
            const totalCount = document.getElementById('totalCount');
            totalCount.textContent = products.length;
            displayProducts(products);
        }

        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showPricelist();
            } else {
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }

            return false;
        }

        // Handle logout
        function handleLogout() {
            sessionStorage.removeItem('isLoggedIn');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showLogin();
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        // Display products
        function displayProducts(productsToShow) {
            const priceList = document.getElementById('priceList');
            const noResults = document.getElementById('noResults');
            const displayCount = document.getElementById('displayCount');
            
            priceList.innerHTML = '';
            
            if (productsToShow.length === 0) {
                noResults.classList.add('show');
                displayCount.textContent = '0';
            } else {
                noResults.classList.remove('show');
                productsToShow.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'price-item';
                    
                    let codesHtml = '';
                    if (product.main_code && product.main_code !== 'nan') {
                        codesHtml += `<div class="code-badge">Main Code: <span>${product.main_code}</span></div>`;
                    }
                    if (product.alt_code && product.alt_code !== 'nan' && product.alt_code !== product.main_code) {
                        codesHtml += `<div class="code-badge">Alt Code: <span>${product.alt_code}</span></div>`;
                    }
                    
                    item.innerHTML = `
                        <div class="item-header">
                            <div class="item-name">${product.name}</div>
                        </div>
                        ${codesHtml ? `<div class="item-codes">${codesHtml}</div>` : ''}
                        <div class="item-prices">
                            <div class="price-box before-tax">
                                <div class="price-label">Before Tax</div>
                                <div class="price-value">${product.price_before_tax.toFixed(2)} SAR</div>
                            </div>
                            <div class="price-box after-tax">
                                <div class="price-label">After Tax (15%)</div>
                                <div class="price-value">${product.price_after_tax.toFixed(2)} SAR</div>
                            </div>
                        </div>
                    `;
                    priceList.appendChild(item);
                });
                displayCount.textContent = productsToShow.length;
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) ||
                product.price_before_tax.toString().includes(searchTerm) ||
                product.price_after_tax.toString().includes(searchTerm) ||
                (product.main_code && product.main_code.toLowerCase().includes(searchTerm)) ||
                (product.alt_code && product.alt_code.toLowerCase().includes(searchTerm))
            );
            
            displayProducts(filteredProducts);
        });

        // Keyboard shortcut for search
        document.addEventListener('keydown', function(e) {
            const searchInput = document.getElementById('searchInput');
            if (e.key === '/' && !e.ctrlKey && e.target !== searchInput && sessionStorage.getItem('isLoggedIn') === 'true') {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
